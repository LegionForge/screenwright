[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenwright"
version = "0.1.0"
description = "A focused documentation screenshot pipeline with MCP server interface"
authors = [{ name = "LegionForge", email = "jp@legionforge.org" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "anthropic>=0.30.0",
    "ollama>=0.1.0",
    "rich>=13.0.0",
]

[project.scripts]
screenwright = "screenwright.__main__:main"
screenwright-mcp = "screenwright.mcp_server:main"

[project.optional-dependencies]
dev = ["ruff>=0.3.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/screenwright"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that require a live browser or network (deselect with -m 'not integration')"]
