[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenwright"
version = "0.1.0"
description = "A focused documentation screenshot pipeline with MCP server interface"
authors = [{ name = "LegionForge", email = "jp@legionforge.org" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0,<2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
screenwright = "screenwright.__main__:main"
screenwright-mcp = "screenwright.mcp_server:main"

[project.optional-dependencies]
# Each vision provider's SDK is an extra, not a hard dependency — a user
# who only wants provider="ollama" (fully local) shouldn't have to pull in
# both cloud SDKs too. `describe()` still dispatches on `provider` at
# runtime and raises a clear "pip install screenwright[x]" ImportError if
# the matching extra isn't installed, rather than failing at import time.
# Upper bounds pin against the exact failure mode that broke CI with mcp
# 2.0.0 this session (a breaking major release silently resolved by an
# unbounded >= constraint). anthropic 1.0.0 (just released) was checked
# structurally compatible before setting its bound at <2.0.0 — Message.
# content/stop_reason and TextBlock.text/type all still present. openai's
# bound reflects 3.x, already in active use in this project's own dev/CI
# installs without issue. Revisit each bound deliberately when it needs
# raising, rather than letting a future major version resolve silently.
anthropic = ["anthropic>=1.0.0,<2.0.0"]
openai = ["openai>=3.3.1,<4.0.0"]
ollama = ["ollama>=0.6.2"]
vision = ["screenwright[anthropic,openai,ollama]"]
dev = ["ruff>=0.16.4", "pytest>=8.0.0", "pytest-asyncio>=1.4.0", "screenwright[vision]"]

[tool.hatch.build.targets.wheel]
packages = ["src/screenwright"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown formatting stabilized (no longer preview-gated) in ruff 0.16 —
# exclude docs so illustrative code fences in README/docs aren't reformatted
# as if they were real source, and so a ruff bump can't silently break CI
# the way it did when 0.16 started formatting *.md by default.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that require a live browser or network (deselect with -m 'not integration')"]
