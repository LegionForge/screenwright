name: CI

# actions/checkout and actions/setup-python are pinned to commit SHA rather
# than a floating version tag (a tag can be re-pointed at a different, or
# malicious, commit after the fact) — matching the supply-chain-pinning
# standard this repo already follows in security.yml (the dev-rig reusable
# workflow reference) and publish.yml (pypa/gh-action-pypi-publish). Bump
# by resolving the new tag to a SHA and updating both the hash and the
# trailing version comment together, not by switching back to a tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck install/upgrade/uninstall scripts
        run: shellcheck scripts/*.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest
