name: Publish to PyPI

# Actions here are pinned to commit SHA rather than a floating version tag —
# matching ci.yml's own pinning standard (see its header comment) and the
# pypa/gh-action-pypi-publish pin below, which predates this. This job pair
# is more sensitive than ci.yml's, not less: `publish` runs with
# `id-token: write` for PyPI's trusted-publishing OIDC exchange, so a
# re-pointed floating tag on any step here — not just the publish step
# itself — could run untrusted code with that privilege in scope. Bump by
# resolving the new tag to a SHA and updating both the hash and the
# trailing version comment together, not by switching back to a tag.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build
        run: |
          pip install hatchling
          python -m hatchling build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
